  <main id="main">
  <section class="pagehead">
    <div class="wrap">
      <nav class="crumbs" aria-label="Breadcrumb">
        <a href="index.html" data-i18n="nav.home"></a>
        <span aria-hidden="true">/</span>

      <h1 data-i18n="contact.title"></h1>
      <p class="lead" data-i18n="contact.lead"></p>
    </div>
  </section>

    <section class="section">
      <div class="wrap split split--wide">

        <div>
          <h2 data-i18n="contact.formTitle"></h2>
          <p class="lead" style="margin-block:.75rem 2rem" data-i18n="contact.formLead"></p>

          <div id="form-status" hidden></div>

          <form id="contact-form" novalidate>
            <div class="field">
              <label for="f-name"><span data-i18n="form.f.name"></span> <span class="req">*</span></label>
              <input id="f-name" name="name" type="text" required autocomplete="name"
                     data-i18n-attr="placeholder:form.ph.name">
              <span class="field__err" data-i18n="form.required"></span>
            </div>

            <div class="grid g-2" style="gap:0 1rem">
              <div class="field">
                <label for="f-email"><span data-i18n="form.f.email"></span> <span class="req">*</span></label>
                <input id="f-email" name="email" type="email" required autocomplete="email"
                       data-i18n-attr="placeholder:form.ph.email">
                <span class="field__err" data-i18n="form.required"></span>
              </div>
              <div class="field">
                <label for="f-phone" data-i18n="form.f.phone"></label>
                <input id="f-phone" name="phone" type="tel" autocomplete="tel"
                       data-i18n-attr="placeholder:form.ph.phone">
              </div>
            </div>

            <div class="field">
              <label for="f-klasse" data-i18n="form.f.klasse"></label>
              <select id="f-klasse" name="klasse" data-class-options></select>
            </div>

            <div class="field">
              <label for="f-msg"><span data-i18n="form.f.message"></span> <span class="req">*</span></label>
              <textarea id="f-msg" name="message" required
                        data-i18n-attr="placeholder:form.ph.message"></textarea>
              <span class="field__err" data-i18n="form.required"></span>
            </div>

            <div class="field" hidden aria-hidden="true">
              <label for="f-web" data-i18n="form.f.website"></label>
              <input id="f-web" name="website" type="text" tabindex="-1" autocomplete="off">
            </div>

            <div class="field">
              <label class="checkrow">
                <input type="checkbox" name="privacy" required>
                <span data-i18n-html="form.privacy"></span>
              </label>
              <span class="field__err" data-i18n="form.required"></span>
            </div>

            <button class="btn btn--primary btn--lg" type="submit" data-i18n="form.submit"></button>
            <p class="formnote" data-i18n="form.privacyNote"></p>
          </form>
        </div>

        <div class="stack">
          <div class="infotile">
            <div class="infotile__ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0z"/><circle cx="12" cy="10" r="3"/></svg></div>
            <div>
              <b data-i18n="contact.addressTitle"></b>
              <p><span data-bb="business.street"></span><br>
                 <span data-bb="business.zip"></span> <span data-bb="business.city"></span></p>
            </div>
          </div>

          <div class="infotile">
            <div class="infotile__ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 2 .7 2.9a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.2-1.2a2 2 0 0 1 2.1-.5c.9.3 1.9.6 2.9.7a2 2 0 0 1 1.7 2z"/></svg></div>
            <div>
              <b data-i18n="contact.phoneTitle"></b>
              <a data-bb-href-tel="business.phone" href="#"><span data-bb="business.phone"></span></a><br>
              <a data-bb-href-tel="business.mobile" href="#"><span data-bb="business.mobile"></span></a>
            </div>
          </div>

          <div class="infotile">
            <div class="infotile__ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 6L2 7"/></svg></div>
            <div>
              <b data-i18n="contact.mailTitle"></b>
              <a data-bb-href-mailto="business.email" href="#"><span data-bb="business.email"></span></a>
            </div>
          </div>

          <div class="infotile">
            <div class="infotile__ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg></div>
            <div style="inline-size:100%">
              <b data-i18n="contact.hoursTitle"></b>
              <ul class="hours" data-hours></ul>
              <p class="small muted" style="margin-block-start:.75rem">
                <span data-i18n="contact.theoryTitle"></span>: <span data-bb="theoryTimes"></span>
              </p>
            </div>
          </div>

          <a class="btn btn--dark btn--block" data-bb-href="map.directionsUrl" href="#"
             target="_blank" rel="noopener noreferrer" data-i18n="contact.directions"></a>
        </div>
      </div>
    </section>

    <section class="section--tight">
      <div class="wrap">
        <div class="mapbox">
          <div class="mapconsent">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m9 4-6 2v14l6-2 6 2 6-2V4l-6 2z"/><path d="M9 4v14M15 6v14"/></svg>
            <p data-i18n="contact.mapConsent"></p>
            <button class="btn btn--primary" type="button" data-map-load data-i18n="contact.mapLoad"></button>
            <p class="small muted" style="margin-block-start:1rem">
              <a href="datenschutz.html" data-i18n="contact.mapNote"></a>
            </p>
          </div>
        </div>
      </div>
    </section>

        <nav aria-labelledby="f-legal">

        <div>
          <h5 data-i18n="footer.contactTitle"></h5>
          <address>
            <span data-bb="business.street"></span><br>
